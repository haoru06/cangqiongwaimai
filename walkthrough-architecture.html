    const MERMAID_THEME = {
      primaryColor: '#0a0a0a', primaryTextColor: '#ffffff', primaryBorderColor: '#2a2a2a',
      lineColor: '#a0a0a0', background: '#000000'
    };

    function usePanZoom() {
      const viewportRef = useRef(null);
      const canvasRef = useRef(null);
      const zoomDisplayRef = useRef(null);
      const state = useRef({ zoom: 1, panX: 0, panY: 0 });
      const drag = useRef({ on: false, lx: 0, ly: 0 });

      const apply = useCallback(() => {
        const s = state.current;
        if (canvasRef.current) canvasRef.current.style.transform = `translate(${s.panX}px, ${s.panY}px) scale(${s.zoom})`;
        if (zoomDisplayRef.current) zoomDisplayRef.current.textContent = `${Math.round(s.zoom * 100)}%`;
      }, []);

      const fitToScreen = useCallback(() => {
        const svg = canvasRef.current?.querySelector('svg');
        const viewport = viewportRef.current;
        if (!svg || !viewport) return;
        const s = state.current;
        const vw = viewport.clientWidth;
        const vh = viewport.clientHeight;
        const sw = svg.getBoundingClientRect().width / s.zoom;
        const sh = svg.getBoundingClientRect().height / s.zoom;
        const fit = Math.max(.2, Math.min(1.6, Math.min((vw - 100) / sw, (vh - 150) / sh)));
        s.zoom = fit;
        s.panX = (vw - sw * fit) / 2;
        s.panY = (vh - sh * fit) / 2 + 20;
        apply();
      }, [apply]);

      useEffect(() => {
        const viewport = viewportRef.current;
        if (!viewport) return undefined;
        const onWheel = (event) => {
          event.preventDefault();
          const rect = viewport.getBoundingClientRect();
          const mx = event.clientX - rect.left;
          const my = event.clientY - rect.top;
          const s = state.current;
          const factor = event.deltaY < 0 ? 1.12 : 1 / 1.12;
          const nextZoom = Math.min(4, Math.max(.2, s.zoom * factor));
          const scale = nextZoom / s.zoom;
          s.panX = mx - scale * (mx - s.panX);
          s.panY = my - scale * (my - s.panY);
          s.zoom = nextZoom;
          apply();
        };
        const onPointerDown = (event) => {
          if (event.target.closest('.node')) return;
          drag.current = { on: true, lx: event.clientX, ly: event.clientY };
          viewport.setPointerCapture?.(event.pointerId);
        };
        const onPointerMove = (event) => {
          if (!drag.current.on) return;
          const d = drag.current;
          state.current.panX += event.clientX - d.lx;
          state.current.panY += event.clientY - d.ly;
          d.lx = event.clientX;
          d.ly = event.clientY;
          apply();
        };
        const onPointerUp = () => { drag.current.on = false; };
        viewport.addEventListener('wheel', onWheel, { passive: false });
        viewport.addEventListener('pointerdown', onPointerDown);
        viewport.addEventListener('pointermove', onPointerMove);
        viewport.addEventListener('pointerup', onPointerUp);
        viewport.addEventListener('pointercancel', onPointerUp);
        window.addEventListener('resize', fitToScreen);
        return () => {
          viewport.removeEventListener('wheel', onWheel);
          viewport.removeEventListener('pointerdown', onPointerDown);
          viewport.removeEventListener('pointermove', onPointerMove);
          viewport.removeEventListener('pointerup', onPointerUp);
          viewport.removeEventListener('pointercancel', onPointerUp);
          window.removeEventListener('resize', fitToScreen);
        };
      }, [apply, fitToScreen]);

      const zoomIn = useCallback(() => { state.current.zoom = Math.min(4, state.current.zoom * 1.25); apply(); }, [apply]);
      const zoomOut = useCallback(() => { state.current.zoom = Math.max(.2, state.current.zoom / 1.25); apply(); }, [apply]);
      return { viewportRef, canvasRef, zoomDisplayRef, zoomIn, zoomOut, fitToScreen };
    }

    function MermaidDiagram({ onNodeClick }) {
      const ref = useRef(null);
      useEffect(() => {
        window.nodeClickHandler = onNodeClick;
        mermaid.initialize({
          startOnLoad: false,
          theme: 'dark',
          securityLevel: 'loose',
          themeVariables: {
            ...MERMAID_THEME,
            secondaryColor: '#000000', tertiaryColor: '#000000', mainBkg: '#0a0a0a',
            nodeBorder: '#2a2a2a', clusterBkg: 'rgba(10,10,10,.8)', clusterBorder: '#7c3aed',
            titleColor: '#ffffff', edgeLabelBackground: '#000000'
          },
          flowchart: { useMaxWidth: false, htmlLabels: true, curve: 'basis' }
        });
        let alive = true;
        mermaid.render(`architecture-${Date.now()}`, DIAGRAM).then(({ svg, bindFunctions }) => {
          if (!alive || !ref.current) return;
          ref.current.innerHTML = svg;
          bindFunctions?.(ref.current);
        }).catch((error) => {
          if (ref.current) ref.current.innerHTML = `<pre class="code-block"><code>Mermaid render failed: ${String(error)}</code></pre>`;
        });
        return () => { alive = false; delete window.nodeClickHandler; };
      }, [onNodeClick]);
      return h('div', { ref, className: 'mermaid-wrap' });
    }

    function Summary({ collapsed, onToggle }) {
      if (collapsed) return h('div', { className: 'summary summary-pill', onClick: onToggle }, 'TL;DR · click to expand');
      return h('div', { className: 'summary summary-card', onClick: onToggle }, [
        h('strong', { key: 'title' }, 'TL;DR'),
        h('div', { key: 'copy' }, SUMMARY),
        h('div', { key: 'hint', style: { marginTop: 7, color: '#666', fontSize: 10 } }, 'Click to collapse')
      ]);
    }

    function DetailPanel({ nodeId, node, onClose, highlighted }) {
      useEffect(() => {
        const onKey = (event) => { if (event.key === 'Escape') onClose(); };
        document.addEventListener('keydown', onKey);
        return () => document.removeEventListener('keydown', onKey);
      }, [onClose]);
      return h('aside', { className: 'detail-panel' }, [
        h('button', { key: 'close', className: 'detail-close', onClick: onClose, 'aria-label': 'Close details' }, '×'),
        h('div', { key: 'body', className: 'detail-scroll' }, [
          h('h2', { key: 'title', className: 'detail-title' }, node.title),
          h('div', { key: 'description', className: 'detail-body' }, h('p', null, node.description)),
          highlighted
            ? h('div', { key: 'code', className: 'code-block', dangerouslySetInnerHTML: { __html: highlighted } })
            : h('pre', { key: 'fallback', className: 'code-block' }, h('code', null, node.code)),
          h('div', { key: 'files', className: 'file-section' }, [
            h('div', { key: 'label', className: 'file-label' }, 'Source files'),
            h('div', { key: 'list', className: 'file-list' }, node.files.map((file) => h('div', { key: file }, file)))
          ])
        ])
      ]);
    }

    function Controls({ zoomDisplayRef, onZoomIn, onZoomOut, onFit }) {
      return h('div', { className: 'control-bar' }, [
        h('button', { key: 'out', onClick: onZoomOut, 'aria-label': 'Zoom out' }, '−'),
        h('span', { key: 'value', ref: zoomDisplayRef, className: 'zoom-value' }, '100%'),
        h('button', { key: 'in', onClick: onZoomIn, 'aria-label': 'Zoom in' }, '+'),
        h('button', { key: 'fit', onClick: onFit, 'aria-label': 'Fit diagram' }, 'Fit')
      ]);
    }

    async function createHighlights() {
      const highlighted = {};
      try {
        const languages = [...new Set(Object.values(NODES).map((node) => node.lang))];
        const highlighter = await createHighlighter({ themes: ['vitesse-dark'], langs: languages });
        for (const [id, node] of Object.entries(NODES)) {
          highlighted[id] = highlighter.codeToHtml(node.code, { lang: node.lang, theme: 'vitesse-dark' });
        }
      } catch (error) {
        console.warn('Shiki highlighting unavailable; using fallback code blocks.', error);
      }
      return highlighted;
    }

    function App({ highlighted }) {
      const [activeId, setActiveId] = useState(null);
      const [summaryCollapsed, setSummaryCollapsed] = useState(true);
      const pz = usePanZoom();
      const setActiveNode = useCallback((nodeId) => {
        setActiveId(nodeId);
        document.querySelectorAll('.mermaid-wrap .node').forEach((node) => { node.style.opacity = nodeId ? '.35' : '1'; });
        const selected = document.querySelector(`.mermaid-wrap .node[id*="${nodeId}"]`);
        if (selected) selected.style.opacity = '1';
      }, []);
      const closeDetail = useCallback(() => {
        setActiveId(null);
        document.querySelectorAll('.mermaid-wrap .node').forEach((node) => { node.style.opacity = '1'; });
      }, []);
      useEffect(() => { const timer = setTimeout(pz.fitToScreen, 700); return () => clearTimeout(timer); }, [pz.fitToScreen]);
      return h(React.Fragment, null, [
        h('header', { key: 'header', className: 'page-header' }, [
          h('h1', { key: 'title' }, 'Cangqiong Take-Out · Architecture Walkthrough'),
          h('p', { key: 'subtitle' }, 'A clickable mental model of the current project · 12 concepts · source-anchored details')
        ]),
        h(Summary, { key: 'summary', collapsed: summaryCollapsed, onToggle: () => setSummaryCollapsed((value) => !value) }),
        h('main', { key: 'viewport', ref: pz.viewportRef, className: 'diagram-viewport' },
          h('div', { ref: pz.canvasRef, className: 'diagram-canvas' }, h(MermaidDiagram, { onNodeClick: setActiveNode }))),
        h(Controls, { key: 'controls', zoomDisplayRef: pz.zoomDisplayRef, onZoomIn: pz.zoomIn, onZoomOut: pz.zoomOut, onFit: pz.fitToScreen }),
        h('div', { key: 'legend', className: 'legend' }, LEGEND.map((item) => h('div', { key: item.label, className: 'legend-item' }, [
          h('span', { key: 'dot', className: 'legend-dot', style: { background: item.color } }), item.label
        ]))),
        h('div', { key: 'hint', className: 'hint' }, [h('kbd', { key: 'scroll' }, 'Scroll'), ' zoom · ', h('kbd', { key: 'drag' }, 'Drag'), ' pan · click nodes']),
        activeId && NODES[activeId] ? h(DetailPanel, { key: 'detail', nodeId: activeId, node: NODES[activeId], onClose: closeDetail, highlighted: highlighted[activeId] }) : null
      ]);
    }

    const highlighted = await createHighlights();
    ReactDOM.createRoot(document.getElementById('root')).render(h(App, { highlighted }));
  </script>
</body>
</html>
